trigger:
- main

variables:
  dotnetSdkVersion: '10.x'
  buildConfiguration: 'Release'

stages:

# ---------------------------------------------------------
# STAGE 1: UNIT TESTS & INTEGRATION TESTS (Runs in parallel)
# ---------------------------------------------------------
- stage: Test
  displayName: 'Run Tests'
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Set up .NET Core'
      inputs:
        version: $(dotnetSdkVersion)
    - script: dotnet test JobFinders.UnitTests/JobFinders.UnitTests.csproj --configuration $(buildConfiguration)
      displayName: 'Run unit tests with dotnet'

  - job: IntegrationTests
    displayName: 'Integration Tests'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Set up .NET Core'
      inputs:
        version: $(dotnetSdkVersion)
    - script: dotnet test JobFinders.IntegrationalTests/JobFinders.IntegrationalTests.csproj --configuration $(buildConfiguration)
      displayName: 'Run integration tests with dotnet'

# ---------------------------------------------------------
# STAGE 2: BUILD & PUBLISH ARTIFACT
# ---------------------------------------------------------
- stage: Build
  displayName: 'Build and Publish'
  dependsOn: Test
  jobs:
  - job: BuildJob
    displayName: 'Build Job'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Set up .NET Core'
      inputs:
        version: $(dotnetSdkVersion)
    
    - script: dotnet build --configuration $(buildConfiguration)
      displayName: 'Build with dotnet'
      
    - script: dotnet publish JobFinders.Api/JobFinders.Api.csproj -c $(buildConfiguration) -o "$(Build.ArtifactStagingDirectory)/myapp"
      displayName: 'dotnet publish'
      
    - task: PublishPipelineArtifact@1
      displayName: 'Upload artifact for deployment job'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/myapp'
        artifact: '.net-app'
        publishLocation: 'pipeline'

# ---------------------------------------------------------
# STAGE 3: DEPLOY TO AZURE WEB APP
# ---------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Web App'
    pool:
      vmImage: 'windows-latest'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact from build job'
            inputs:
              artifactName: '.net-app'
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Azure Web App'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'Pay-As-You-Go Dev/Test(7ea259f7-c666-4703-b4c1-df983f852504)'
              appType: 'webApp'
              WebAppName: 'it-job-finder'
              packageForLinux: '$(Pipeline.Workspace)/.net-app'